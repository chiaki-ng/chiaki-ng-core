name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: read-all

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Derive version and channel from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CORE=$(head -n 1 VERSION.txt)
          TAG_VERSION="${TAG#v}"
          PRERELEASE=""
          CHANNEL="stable"
          if [[ "$TAG_VERSION" == *-* ]]; then
            PRERELEASE="${TAG_VERSION#*-}"
            CHANNEL="rc"
          fi

          if [ "${TAG_VERSION%%-*}" != "$CORE" ]; then
            echo "::error::Tag ${TAG} core ${TAG_VERSION%%-*} does not match VERSION.txt ${CORE}"
            exit 1
          fi
          if ! [[ "$PRERELEASE" =~ ^([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag ${TAG} pre-release '${PRERELEASE}' must be dot-separated letters, digits and hyphens"
            exit 1
          fi

          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${TAG_VERSION} (channel: ${CHANNEL})"

  switch:
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/chiaki-ng/devkita64@sha256:3a978bfec72c624aed88b8197f3f46b7288e091f3c28f0e5697b7c211df9c969
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl jq make cmake ninja-build python3 pkg-config xz-utils zstd

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch the libnx dependencies
        id: deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prefix=$(./tools/ci/native-deps.sh nx-deps- "$RUNNER_TEMP/native-deps")
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          make switch \
            DEPS_PREFIX="${{ steps.deps.outputs.prefix }}" \
            CMAKE_ARGS="-DLIBCHIAKING_VERSION_PRERELEASE=${{ needs.version.outputs.prerelease }} -DLIBCHIAKING_COMMIT=${{ needs.version.outputs.commit }}"

      - name: Package
        run: |
          NAME="libchiaking-${{ needs.version.outputs.version }}-switch-aarch64"
          cmake --install build/switch --prefix "stage/${NAME}"
          cp LICENSE "stage/${NAME}/"
          cp "$RUNNER_TEMP/native-deps/TAG" "stage/${NAME}/NATIVE_DEPS"
          tar -C stage -czf "${NAME}.tar.gz" "${NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libchiaking-switch
          path: libchiaking-*.tar.gz

  macos:
    needs: version
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install build tools
        run: brew install ninja

      - name: Fetch the macOS dependencies
        id: deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prefix=$(./tools/ci/native-deps.sh darwin-deps- "$RUNNER_TEMP/native-deps")
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          make darwin-test \
            DEPS_PREFIX="${{ steps.deps.outputs.prefix }}" \
            CMAKE_ARGS="-DLIBCHIAKING_VERSION_PRERELEASE=${{ needs.version.outputs.prerelease }} -DLIBCHIAKING_COMMIT=${{ needs.version.outputs.commit }}"

      - name: Build
        run: |
          make darwin \
            DEPS_PREFIX="${{ steps.deps.outputs.prefix }}" \
            CMAKE_ARGS="-DLIBCHIAKING_VERSION_PRERELEASE=${{ needs.version.outputs.prerelease }} -DLIBCHIAKING_COMMIT=${{ needs.version.outputs.commit }}"

      - name: Package
        run: |
          NAME="libchiaking-${{ needs.version.outputs.version }}-macos-arm64"
          cmake --install build/darwin --prefix "stage/${NAME}"
          cp LICENSE "stage/${NAME}/"
          cp "$RUNNER_TEMP/native-deps/TAG" "stage/${NAME}/NATIVE_DEPS"
          tar -C stage -czf "${NAME}.tar.gz" "${NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libchiaking-macos
          path: libchiaking-*.tar.gz

  release:
    needs: [version, switch, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libchiaking-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum libchiaking-*.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@b25b93d384199fc0fc8c2e126b2d937a0cbeb2ae # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: libchiaking ${{ needs.version.outputs.version }}
          files: |
            libchiaking-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.version.outputs.channel == 'rc' }}
