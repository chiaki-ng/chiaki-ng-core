query metGetConceptByProductIdQuery($ctaContext: String, $productId: String!) {
  productRetrieve(productId: $productId) {
    __typename
    concept {
      __typename
      isInWishlist
      isWishlistable
      ownedTitles {
        __typename
        ...ownedTitlesFragment
      }
      personalizedMeta {
        __typename
        ...personalizedMetaFragment
      }
      selectableProducts {
        __typename
        ...selectableProductsFragment
      }
      ...conceptFragment
    }
    id
    isInWishlist
    isWishlistable
    mobilectas(ctaContext: $ctaContext) {
      __typename
      ...mobilectasFragment
    }
    personalizedMeta {
      __typename
      ...personalizedMetaFragment
    }
    price {
      __typename
      ...skuPriceFragment
    }
  }
}
